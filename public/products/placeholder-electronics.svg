<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <rect width="600" height="600" fill="#E8F0FA"/>
  <!-- Subtle circular backdrop -->
  <circle cx="300" cy="300" r="160" fill="none" stroke="#1D4E89" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.3"/>
  <g fill="none" stroke="#1D4E89" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Smart Television (center/background) -->
    <!-- TV Outer frame -->
    <rect x="170" y="190" width="260" height="165" rx="6"/>
    <!-- TV Screen inner border -->
    <rect x="180" y="200" width="240" height="140" rx="3"/>
    <!-- TV Stand -->
    <path d="M280 355 L270 385 L330 385 L320 355"/>
    <line x1="250" y1="385" x2="350" y2="385"/>

    <!-- Smartphone (foreground right) -->
    <rect x="330" y="270" width="85" height="155" rx="12" fill="#E8F0FA"/>
    <!-- Phone screen -->
    <rect x="336" y="282" width="73" height="130" rx="6"/>
    <!-- Speaker & Camera -->
    <line x1="362" y1="276" x2="382" y2="276"/>
    <circle cx="355" cy="276" r="1.5" fill="#1D4E89"/>
    <!-- Home bar -->
    <line x1="360" y1="404" x2="385" y2="404"/>
  </g>
</svg>
